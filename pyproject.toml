[project]
name = "mimik"
version = "0.3.0"
description = "Intercept any app, then call it from Python like a library — Linux port of littledivy/mimic."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Broke n' Bored Studio" }]
dependencies = ["requests>=2.28", "PySide6>=6.6", "mitmproxy>=10"]

[project.optional-dependencies]
capture = ["mitmproxy>=10"]
gui = ["PySide6>=6.6"]
all = ["mitmproxy>=10", "PySide6>=6.6"]

[project.scripts]
mimik = "mimik.cli:main"
mimik-gui = "mimik.gui:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mimik*"]
