# MIMIK CI — the guard that would have caught the fresh-clone icon
# defect (v0.2: 18 tests errored from a clone while the zip stayed
# green). Runs the suite from a fresh checkout, in both envs, on
# every push to main. The Reblend fixture isn't in CI, so the
# asset/bridge tests that need it skip here — same as any machine
# without a Reblend folder.
#
# "on" is quoted: unquoted it parses as the boolean True under YAML
# 1.1, which breaks YAML tooling (GitHub accepts the quoted form).
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-system:
    name: Suite (system Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install requests
      - name: Run the suite
        run: python -m unittest discover -s tests

  test-qt:
    name: Suite (Qt env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libfontconfig1
      - name: Install test dependencies
        run: pip install requests PySide6
      - name: Run the suite (Qt env)
        env:
          MIMIK_TEST_QIMAGE: "1"
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests
